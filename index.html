<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สมัครสมาชิก</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{
  --gd:#1a5c2a; --gm:#2e7d32; --gp:#e8f5e9; --gb:#c8e6c9;
  --g6:#757575; --g8:#424242; --td:#1b2e1c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:var(--td);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:400px;width:100%;overflow:hidden;}
.hd{background:linear-gradient(135deg,var(--gd),#66bb6a);padding:32px 24px;text-align:center;color:#fff;}
.avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.hd h1{font-size:19px;font-weight:600;}
.hd p{font-size:13px;opacity:.9;margin-top:4px;}
.bd{padding:28px 24px;}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.fg label{font-size:13px;font-weight:600;color:var(--g8);}
.fc{height:46px;padding:0 14px;border:1.5px solid #eee;border-radius:10px;font-size:15px;
  font-family:'Sarabun',sans-serif;width:100%;}
.fc:focus{outline:none;border-color:var(--gm);}
.hint{font-size:12px;color:var(--g6);margin-top:4px;}
.btn{width:100%;height:48px;border:none;border-radius:10px;background:var(--gm);color:#fff;
  font-size:15px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;}
.btn:disabled{opacity:.5;}
.state{text-align:center;padding:20px 0;}
.state .ico{font-size:40px;margin-bottom:12px;}
#errorMsg{white-space:pre-line;text-align:left;font-size:13px;line-height:1.6;background:#fff3e0;border-radius:8px;padding:12px;}
.err{background:#ffebee;color:#c62828;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
.err.show{display:block;}
.member-info{background:var(--gp);border-radius:12px;padding:16px;text-align:left;}
.member-info .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
.member-info .row span:first-child{color:var(--g6);}
.member-info .row span:last-child{font-weight:600;color:var(--gd);}
.sh{display:none;}
</style>
</head>
<body>

<div class="card">
  <div class="hd">
    <div class="avatar" id="avatar">👤</div>
    <h1>สมัครสมาชิก</h1>
    <p>Spunky Food Member</p>
  </div>
  <div class="bd">

    <div id="loadingState" class="state">
      <div class="ico">⏳</div>
      <p style="color:var(--g6);font-size:14px">กำลังเชื่อมต่อกับ LINE...</p>
    </div>

    <div id="registerState" class="sh">
      <div class="err" id="errBox"></div>
      <div class="fg">
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" class="fc" id="phoneInput" placeholder="08X-XXX-XXXX" maxlength="10">
        <div class="hint">ใช้ผูกกับประวัติการสั่งซื้อของคุณ</div>
      </div>
      <button class="btn" id="submitBtn" onclick="submitRegister()">✅ สมัครสมาชิก</button>
    </div>

    <div id="alreadyMemberState" class="sh state">
      <div class="ico">🎉</div>
      <p style="font-weight:600;margin-bottom:16px">คุณเป็นสมาชิกอยู่แล้ว</p>
      <div class="member-info">
        <div class="row"><span>เบอร์โทร</span><span id="miPhone"></span></div>
        <div class="row"><span>แต้มสะสม</span><span id="miPoints"></span></div>
        <div class="row"><span>ระดับสมาชิก</span><span id="miTier"></span></div>
      </div>
    </div>

    <div id="successState" class="sh state">
      <div class="ico">🎉</div>
      <p style="font-weight:600">สมัครสมาชิกสำเร็จ!</p>
      <p style="color:var(--g6);font-size:14px;margin-top:6px">ยินดีต้อนรับเข้าสู่ครอบครัว Spunky Food</p>
    </div>

    <div id="errorState" class="sh state"></div>

  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ⚠️ ใส่ LIFF ID ของตัวเองตรงนี้
var LIFF_ID = '2010892131-hMnmdrmH';

// ⚠️ ใส่ Apps Script Web App URL ตรงนี้ (ลงท้ายด้วย /exec)
// หน้านี้จะยิง fetch() ไปที่ URL นี้แทนการใช้ google.script.run (ซึ่งใช้ได้เฉพาะหน้าที่ Apps Script เสิร์ฟเองเท่านั้น)
var API_URL = 'https://script.google.com/macros/s/AKfycbyy_557iqmJS6qrXaNsUy-w1gNZKY37YYLW1WIYJXr89gjdDbmxGtJFvQiizDM-VHBrYQ/exec';

var currentIdToken = null;

function showState(id){
  ['loadingState','registerState','alreadyMemberState','successState','errorState'].forEach(function(s){
    document.getElementById(s).classList.toggle('sh', s !== id);
  });
}
function showErrorState(msg){
  document.getElementById('errorState').innerHTML = '<div class="ico">⚠️</div><div id="errorMsg">' + msg.replace(/</g,'&lt;') + '</div>';
  showState('errorState');
}

// เรียก Apps Script ผ่าน fetch() แบบ GET เสมอ (แม้แต่ action ที่เปลี่ยนแปลงข้อมูลอย่าง registerMember)
// เพราะ Apps Script ตอบกลับด้วย HTTP redirect เสมอ ซึ่งเบราว์เซอร์ในแอป LINE (โดยเฉพาะ iOS)
// มักบล็อก redirect ของ POST เนื่องจากกฎ CORS เข้มงวดกว่า — GET ไม่มีปัญหานี้ เสถียรกว่ามาก
function callApi(action, payload){
  payload = payload || {};
  payload.action = action;
  var qs = Object.keys(payload).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(payload[k]);
  }).join('&');
  return fetch(API_URL + '?' + qs, { method: 'GET' }).then(function(res){ return res.json(); });
}

function initLiff(){
  document.getElementById('loadingState').querySelector('p').textContent = 'กำลังเชื่อมต่อกับ LINE... (ขั้นที่ 1: liff.init)';

  var initTimeout = setTimeout(function(){
    showErrorState(
      'liff.init() ค้างเกิน 10 วินาที\n' +
      'LIFF_ID: "' + LIFF_ID + '"\n' +
      'กรุณา screenshot ส่งกลับมา'
    );
  }, 10000);

  liff.init({ liffId: LIFF_ID }).then(function(){
    clearTimeout(initTimeout);
    if (!liff.isLoggedIn()) {
      document.getElementById('loadingState').querySelector('p').textContent = 'กำลังพาไปหน้า login ของ LINE...';
      liff.login();
      return;
    }
    currentIdToken = liff.getIDToken();
    if (!currentIdToken) {
      showErrorState('liff.getIDToken() คืนค่าว่างเปล่า — เช็ค scope "openid" ในหน้า LIFF settings');
      return;
    }
    var profile = liff.getDecodedIDToken();
    if (profile && profile.picture) {
      document.getElementById('avatar').innerHTML = '<img src="'+profile.picture+'">';
    }
    document.getElementById('loadingState').querySelector('p').textContent = 'กำลังเช็คสถานะสมาชิก...';
    checkStatus();
  }).catch(function(e){
    clearTimeout(initTimeout);
    showErrorState('liff.init() ล้มเหลว: ' + (e && e.message ? e.message : JSON.stringify(e)));
  });
}

function checkStatus(){
  callApi('checkMemberStatus', { idToken: currentIdToken })
    .then(function(r){
      if (!r || !r.success) { showErrorState('checkMemberStatus error: ' + (r ? r.error : 'ไม่ทราบสาเหตุ')); return; }
      if (r.isMember) {
        document.getElementById('miPhone').textContent = r.member.phone;
        document.getElementById('miPoints').textContent = r.member.points + ' แต้ม';
        document.getElementById('miTier').textContent = r.member.tier;
        showState('alreadyMemberState');
      } else {
        showState('registerState');
      }
    })
    .catch(function(e){ showErrorState('เรียก API ไม่สำเร็จ: ' + e.message); });
}

function submitRegister(){
  var phone = document.getElementById('phoneInput').value.trim();
  var errBox = document.getElementById('errBox');
  errBox.classList.remove('show');
  if (!/^0\d{9}$/.test(phone)) {
    errBox.textContent = 'กรุณากรอกเบอร์โทร 10 หลัก ขึ้นต้นด้วย 0';
    errBox.classList.add('show');
    return;
  }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  callApi('registerMember', { idToken: currentIdToken, phoneNumber: phone })
    .then(function(r){
      btn.disabled = false; btn.textContent = '✅ สมัครสมาชิก';
      if (r && r.success) { showState('successState'); }
      else { errBox.textContent = r ? r.error : 'เกิดข้อผิดพลาด'; errBox.classList.add('show'); }
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = '✅ สมัครสมาชิก';
      errBox.textContent = 'Error: ' + e.message;
      errBox.classList.add('show');
    });
}

initLiff();
</script>
</body>
</html>
